name: Release

# Tags only. The previous pipeline released on every push to main and on every
# pull request, which produced releases nobody asked for and version numbers
# that had nothing to do with the manifest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest

    env:
      # `secrets` is not available in step-level `if`, so surface the ones that
      # gate optional steps as env vars.
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # The Web Store rejects a re-upload of an existing version, so the tag
      # and the manifest must agree before we build a package at all.
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./build/manifest.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version." >&2
            echo "Bump \"version\" in package.json and retag." >&2
            exit 1
          fi

      # manifest.json must sit at the root of the zip, so zip the *contents* of
      # build/ rather than the directory itself.
      - name: Package extension
        run: |
          cd build
          zip -r -FS ../vtabs.zip . -x '*.map'
          cd ..
          unzip -l vtabs.zip

      - name: Attach package to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vtabs.zip
          generate_release_notes: true

      - name: Upload to the Chrome Web Store
        if: env.CWS_CLIENT_ID != '' && startsWith(github.ref, 'refs/tags/')
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source vtabs.zip \
            --extension-id "$CWS_EXTENSION_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN"

      # Left as a separate manual step on purpose: publishing starts review and
      # ships to users, which should be a deliberate decision.
      - name: Reminder
        if: env.CWS_CLIENT_ID != ''
        run: echo "Draft uploaded. Publish from the Web Store dashboard when ready."
