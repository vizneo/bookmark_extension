<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vTabs</title>
  </head>
  <body>
    <main class="container">
      <div id="loading" class="state">
        <div class="spinner" role="status" aria-label="Loading"></div>
        <p>Loading tab group…</p>
      </div>

      <div id="content" hidden>
        <header class="group-header">
          <h1 id="groupName"></h1>
          <p class="meta">
            <span id="tabCount"></span> &middot; <span id="timestamp"></span>
          </p>
        </header>

        <div class="actions">
          <button type="button" class="btn btn-primary" id="restoreAllBtn">
            Open all tabs
          </button>
          <button type="button" class="btn btn-warning" id="restoreAndDeleteBtn">
            Open all &amp; delete group
          </button>
          <button type="button" class="btn" id="backBtn">Close</button>
        </div>

        <p id="status" class="status" role="status" hidden></p>

        <ul id="tabsList" class="tabs-list"></ul>
      </div>

      <div id="error" class="state" hidden>
        <h2>Group not found</h2>
        <p>This tab group may have been deleted.</p>
        <button type="button" class="btn" id="errorCloseBtn">Close</button>
      </div>
    </main>
  </body>
</html>
